<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EARTH // LIVE — Planetary Climate Intelligence &amp; Satellite Telemetry</title>
    <meta name="description" content="Authentic 3D WebGL planetary climate intelligence platform tracking NASA FIRMS Near-Real-Time active fire clusters (VIIRS/MODIS), NOAA NHC tropical cyclones, and peer-reviewed climate indicators." />
    <link rel="canonical" href="https://earthlive.org/" />

    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="EARTH // LIVE — Planetary Climate Intelligence &amp; Satellite Telemetry" />
    <meta property="og:description" content="3D Earth platform visualizing Near-Real-Time NASA FIRMS active fires, NOAA NHC tropical cyclones, and planetary climate indicators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Schema.org WebSite & Dataset JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "EARTH // LIVE",
          "url": "https://earthlive.org/",
          "description": "A visual intelligence layer for Earth's changing climate.",
          "inLanguage": "en-US"
        },
        {
          "@type": "Dataset",
          "name": "NASA FIRMS Active Thermal Anomaly Telemetry",
          "description": "Near-Real-Time satellite fire radiative power observations from VIIRS NOAA-20, NOAA-21, and Terra/Aqua MODIS.",
          "creator": {
            "@type": "Organization",
            "name": "NASA LANCE / ESDIS"
          },
          "distribution": {
            "@type": "DataDownload",
            "contentUrl": "https://firms.modaps.eosdis.nasa.gov/"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts for Scientific HUD -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body class="bg-[#030712] text-slate-100 min-h-screen m-0 p-0 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

    <script type="module" src="/src/main.tsx"></script>
